<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Money Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        input {
            padding: 8px;
            font-size: 16px;
        }
        #robot-container {
            margin: 15px auto;
            display: none;
        }
        #robot-img {
            width: 80px;
            height: 80px;
            background-color: #b0bec5;
            border-radius: 10px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Math Money Game</h1>
        <p>Level: <span id="level">Noob</span></p>
        <p>Coins: <span id="coins">0</span></p>
        <p>Correct in current level: <span id="correctCount">0</span> / 2</p>
        
        <h3 id="question">Loading question...</h3>
        
        <!-- Robot and Timer Display -->
        <div id="robot-container">
            <div id="robot-img">🤖</div>
            <p>Robo-is thinking... <span id="countdown">5</span>s</p>
        </div>

        <input type="number" id="answer" placeholder="Your answer">
        <br>
        <button onclick="checkAnswer()">Submit</button>

        <h3>Shop / Level Up</h3>
        <button onclick="buyRobot()">Buy Robo-Solver (5 Coins)</button><br>
        <button onclick="buyLevel('Pro', 100)">Buy Pro Level (100 Coins)</button><br>
        <button onclick="buyLevel('God', 1000)">Buy God Level (1,000 Coins)</button><br>
        <button onclick="buyLevel('Hacker', 1000000)">Buy Hacker Level (1,000,000 Coins)</button><br>
        <button onclick="buyLevel('Rat Hacker', 100000000)">Buy Rat Hacker Level (100,000,000 Coins)</button>
        <br>
        <br>
        <center>Version 4</center>
    </div>

    <script>
        let coins = 0;
        let correctCount = 0;
        let currentLevel = "Noob";
        let num1, num2, correctAnswer;
        let robotActive = false;
        let robotTimer = null;
        let countdownTimer = null;

        function generateQuestion() {
            let operators = ['+', '-', '*', '/'];
            let op = operators[Math.floor(Math.random() * operators.length)];

            if (op === '+') {
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * 50) + 10;
                correctAnswer = num1 + num2;
                document.getElementById("question").innerText = `What is ${num1} + ${num2}?`;
            } else if (op === '-') {
                num1 = Math.floor(Math.random() * 50) + 20;
                num2 = Math.floor(Math.random() * 20) + 1;
                correctAnswer = num1 - num2;
                document.getElementById("question").innerText = `What is ${num1} - ${num2}?`;
            } else if (op === '*') {
                num1 = Math.floor(Math.random() * 12) + 2;
                num2 = Math.floor(Math.random() * 12) + 2;
                correctAnswer = num1 * num2;
                document.getElementById("question").innerText = `What is ${num1} × ${num2}?`;
            } else if (op === '/') {
                num2 = Math.floor(Math.random() * 10) + 2;
                let multiplier = Math.floor(Math.random() * 10) + 2;
                num1 = num2 * multiplier;
                correctAnswer = multiplier;
                document.getElementById("question").innerText = `What is ${num1} ÷ ${num2}?`;
            }

            // If robot is active, trigger the 5-second countdown for the new question
            if (robotActive) {
                startRobotCycle();
            }
        }

        function checkAnswer() {
            let userAnswer = parseInt(document.getElementById("answer").value);
            if (userAnswer === correctAnswer) {
                correctCount++;
                if (correctCount >= 2) {
                    correctCount = 0;
                    giveReward();
                }
                alert("Correct!");
            } else {
                alert("Wrong! Try again.");
            }
            document.getElementById("correctCount").innerText = correctCount;
            document.getElementById("answer").value = "";
            generateQuestion();
        }

        function buyRobot() {
            if (coins >= 5) {
                coins -= 5;
                document.getElementById("coins").innerText = coins;
                
                robotActive = true;
                document.getElementById("robot-container").style.display = "block";
                alert("Beep boop! Robo-Solver activated!");
                
                startRobotCycle();
            } else {
                alert("Not enough coins for the robot!");
            }
        }

        function startRobotCycle() {
            // Clear any existing timers just in case
            clearTimeout(robotTimer);
            clearInterval(countdownTimer);

            let timeLeft = 5;
            document.getElementById("countdown").innerText = timeLeft;

            countdownTimer = setInterval(() => {
                timeLeft--;
                document.getElementById("countdown").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                }
            }, 1000);

            robotTimer = setTimeout(() => {
                // Automatically count it as a correct answer
                correctCount++;
                if (correctCount >= 2) {
                    correctCount = 0;
                    giveReward();
                }
                document.getElementById("correctCount").innerText = correctCount;
                generateQuestion();
            }, 5000);
        }

        function giveReward() {
            if (currentLevel === "Noob") coins += 5;
            else if (currentLevel === "Pro") coins += 100;
            else if (currentLevel === "God") coins += 1000;
            else if (currentLevel === "Hacker") coins += 1000000;
            else if (currentLevel === "Rat Hacker") coins += 100000000;
            document.getElementById("coins").innerText = coins;
        }

        function buyLevel(levelName, cost) {
            if (coins >= cost) {
                coins -= cost;
                currentLevel = levelName;
                document.getElementById("coins").innerText = coins;
                document.getElementById("level").innerText = currentLevel;
                alert("You leveled up to " + levelName + "!");
            } else {
                alert("Not enough coins!");
            }
        }

        generateQuestion();
    </script>

</body>
</html>
