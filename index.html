<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Money Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        input {
            padding: 8px;
            font-size: 16px;
        }
        #robot-container {
            margin: 15px auto;
            display: none;
        }
        #robot-img {
            width: 80px;
            height: 80px;
            background-color: #b0bec5;
            border-radius: 10px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Math Money Game</h1>
        <p>Level: <span id="level">Noob</span></p>
        <p>Coins: <span id="coins">0</span></p>
        <p>Correct in current level: <span id="correctCount">0</span> / <span id="targetCount">2</span></p>
        
        <h3 id="question">Loading question...</h3>
        <h3 id="question2" style="display:none; color: #d32f2f;"></h3>
        
        <!-- Robot and Timer Display -->
        <div id="robot-container">
            <div id="robot-img">🤖</div>
            <p><span id="robot-status">Robo-is thinking...</span> <span id="countdown">5</span>s</p>
        </div>

        <input type="number" id="answer" placeholder="Your answer">
        <br>
        <button onclick="checkAnswer()">Submit</button>

        <h3>Shop / Level Up</h3>
        <button onclick="buyRobot()">Buy Robo-Solver (5 Coins)</button><br>
        <button id="upgrade-btn" onclick="buyUpgradedRobot()" style="display:none;">Upgrade Robot (10 Coins)</button><br>
        <button onclick="buyLevel('Pro', 100)">Buy Pro Level (100 Coins)</button><br>
        <button onclick="buyLevel('God', 1000)">Buy God Level (1,000 Coins)</button><br>
        <button onclick="buyLevel('Hacker', 1000000)">Buy Hacker Level (1,000,000 Coins)</button><br>
        <button onclick="buyLevel('Rat Hacker', 100000000)">Buy Rat Hacker Level (100,000,000 Coins)</button><br>
        <button onclick="buyLevel('Lion Hacker', 1000000000)">Buy Lion Hacker Level (1,000,000,000 Coins)</button><br>
        <button onclick="buyLevel('Zombie Hacker', 100000000000)">Buy Zombie Hacker Level (100,000,000,000 Coins)</button><br>
        <button onclick="buyLevel('Zombie Divine', 1000000000000)">Buy Zombie Divine Level (1 Trillion Coins)</button><br>
        <button onclick="buyLevel('Wow Divine', 100000000000000)">Buy Wow Divine Level (100 Trillion Coins)</button>
        
        <br><br>
        <button onclick="openSecretMenu()" style="background-color: #cfd8dc; font-size: 14px;">Secret Level Menu</button>

        <!-- Secret Menu -->
        <div id="secret-menu" style="display:none; margin-top: 15px; border-top: 2px dashed #b0bec5; padding-top: 10px;">
            <h4>Secret Level Changer</h4>
            <select id="secret-level-select" style="padding: 5px; font-size: 14px;">
                <option value="Noob">Noob</option>
                <option value="Pro">Pro</option>
                <option value="God">God</option>
                <option value="Hacker">Hacker</option>
                <option value="Rat Hacker">Rat Hacker</option>
                <option value="Lion Hacker">Lion Hacker</option>
                <option value="Zombie Hacker">Zombie Hacker</option>
                <option value="Zombie Divine">Zombie Divine</option>
                <option value="Wow Divine">Wow Divine</option>
            </select>
            <br>
            <button onclick="applySecretLevel()" style="padding: 5px 10px; font-size: 14px; margin-top: 5px;">Change Level</button>
        </div>

        <br>
        <center>Version 9</center>
    </div>

    <script>
        let coins = 0;
        let correctCount = 0;
        let currentLevel = "Noob";
        let num1, num2, correctAnswer;
        let num3, num4, correctAnswer2;
        let robotActive = false;
        let robotUpgraded = false;
        let robotTimer = null;
        let countdownTimer = null;

        function getTargetCount() {
            if (currentLevel === "Lion Hacker" || currentLevel === "Zombie Hacker" || currentLevel === "Zombie Divine" || currentLevel === "Wow Divine") {
                return 10;
            }
            return 2;
        }

        function generateQuestion() {
            let operators = ['+', '-', '*', '/'];
            let op = operators[Math.floor(Math.random() * operators.length)];

            if (op === '+') {
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * 50) + 10;
                correctAnswer = num1 + num2;
                document.getElementById("question").innerText = `What is ${num1} + ${num2}?`;
            } else if (op === '-') {
                num1 = Math.floor(Math.random() * 50) + 20;
                num2 = Math.floor(Math.random() * 20) + 1;
                correctAnswer = num1 - num2;
                document.getElementById("question").innerText = `What is ${num1} - ${num2}?`;
            } else if (op === '*') {
                num1 = Math.floor(Math.random() * 12) + 2;
                num2 = Math.floor(Math.random() * 12) + 2;
                correctAnswer = num1 * num2;
                document.getElementById("question").innerText = `What is ${num1} × ${num2}?`;
            } else if (op === '/') {
                num2 = Math.floor(Math.random() * 10) + 2;
                let multiplier = Math.floor(Math.random() * 10) + 2;
                num1 = num2 * multiplier;
                correctAnswer = multiplier;
                document.getElementById("question").innerText = `What is ${num1} ÷ ${num2}?`;
            }

            if (robotUpgraded) {
                let op2 = operators[Math.floor(Math.random() * operators.length)];
                if (op2 === '+') {
                    num3 = Math.floor(Math.random() * 50) + 10;
                    num4 = Math.floor(Math.random() * 50) + 10;
                    correctAnswer2 = num3 + num4;
                    document.getElementById("question2").innerText = `What is ${num3} + ${num4}?`;
                } else if (op2 === '-') {
                    num3 = Math.floor(Math.random() * 50) + 20;
                    num4 = Math.floor(Math.random() * 20) + 1;
                    correctAnswer2 = num3 - num4;
                    document.getElementById("question2").innerText = `What is ${num3} - ${num4}?`;
                } else if (op2 === '*') {
                    num3 = Math.floor(Math.random() * 12) + 2;
                    num4 = Math.floor(Math.random() * 12) + 2;
                    correctAnswer2 = num3 * num4;
                    document.getElementById("question2").innerText = `What is ${num3} × ${num4}?`;
                } else if (op2 === '/') {
                    num4 = Math.floor(Math.random() * 10) + 2;
                    let multiplier2 = Math.floor(Math.random() * 10) + 2;
                    num3 = num4 * multiplier2;
                    correctAnswer2 = multiplier2;
                    document.getElementById("question2").innerText = `What is ${num3} ÷ ${num4}?`;
                }
                document.getElementById("question2").style.display = "block";
            }

            if (robotActive) {
                startRobotCycle();
            }
        }

        function checkAnswer() {
            let userAnswer = parseInt(document.getElementById("answer").value);
            if (userAnswer === correctAnswer) {
                correctCount++;
                let target = getTargetCount();
                if (correctCount >= target) {
                    correctCount = 0;
                    giveReward();
                }
                alert("Correct!");
            } else {
                alert("Wrong! Try again.");
            }
            document.getElementById("correctCount").innerText = correctCount;
            document.getElementById("targetCount").innerText = getTargetCount();
            document.getElementById("answer").value = "";
            generateQuestion();
        }

        function buyRobot() {
            if (coins >= 5) {
                coins -= 5;
                document.getElementById("coins").innerText = coins;
                
                robotActive = true;
                document.getElementById("robot-container").style.display = "block";
                document.getElementById("upgrade-btn").style.display = "inline-block";
                alert("Beep boop! Robo-Solver activated!");
                
                startRobotCycle();
            } else {
                alert("Not enough coins for the robot!");
            }
        }

        function buyUpgradedRobot() {
            if (coins >= 10) {
                coins -= 10;
                document.getElementById("coins").innerText = coins;
                
                robotUpgraded = true;
                document.getElementById("robot-img").innerText = "😈";
                document.getElementById("robot-img").style.backgroundColor = "#b71c1c";
                document.getElementById("robot-status").innerText = "DESTRUCTION BOT crushing...";
                document.getElementById("upgrade-btn").style.display = "none";
                alert("ROBO UPGRADED! He looks mean and is ready to blast two questions at once!");
                
                startRobotCycle();
            } else {
                alert("Not enough coins to upgrade the robot!");
            }
        }

        function startRobotCycle() {
            clearTimeout(robotTimer);
            clearInterval(countdownTimer);

            let timeLeft = robotUpgraded ? 2 : 5;
            document.getElementById("countdown").innerText = timeLeft;

            countdownTimer = setInterval(() => {
                timeLeft--;
                document.getElementById("countdown").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                }
            }, 1000);

            robotTimer = setTimeout(() => {
                correctCount += robotUpgraded ? 2 : 1;
                let target = getTargetCount();
                if (correctCount >= target) {
                    correctCount = 0;
                    giveReward();
                }
                document.getElementById("correctCount").innerText = correctCount;
                document.getElementById("targetCount").innerText = target;
                generateQuestion();
            }, robotUpgraded ? 2000 : 5000);
        }

        function giveReward() {
            if (currentLevel === "Noob") coins += 5;
            else if (currentLevel === "Pro") coins += 100;
            else if (currentLevel === "God") coins += 1000;
            else if (currentLevel === "Hacker") coins += 1000000;
            else if (currentLevel === "Rat Hacker") coins += 100000000;
            else if (currentLevel === "Lion Hacker") coins += 1000000000;
            else if (currentLevel === "Zombie Hacker") coins += 100000000000;
            else if (currentLevel === "Zombie Divine") coins += 1000000000000;
            else if (currentLevel === "Wow Divine") coins += 100000000000000;
            document.getElementById("coins").innerText = coins;
        }

        function buyLevel(levelName, cost) {
            if (coins >= cost) {
                coins -= cost;
                currentLevel = levelName;
                correctCount = 0;
                document.getElementById("coins").innerText = coins;
                document.getElementById("level").innerText = currentLevel;
                document.getElementById("targetCount").innerText = getTargetCount();
                document.getElementById("correctCount").innerText = correctCount;
                alert("You leveled up to " + levelName + "!");
            } else {
                alert("Not enough coins!");
            }
        }

        function openSecretMenu() {
            let pin = prompt("Enter PIN:");
            if (pin === "2018") {
                document.getElementById("secret-menu").style.display = "block";
            } else if (pin !== null) {
                alert("Incorrect PIN!");
            }
        }

        function applySecretLevel() {
            let selectedLevel = document.getElementById("secret-level-select").value;
            currentLevel = selectedLevel;
            correctCount = 0;
            document.getElementById("level").innerText = currentLevel;
            document.getElementById("targetCount").innerText = getTargetCount();
            document.getElementById("correctCount").innerText = correctCount;
            alert("Level changed to " + currentLevel + "!");
            document.getElementById("secret-menu").style.display = "none";
        }

        generateQuestion();
    </script>

</body>
</html>
